services:
  - type: web
    name: fujitrack-ai-platform
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "python -c 'import sys; sys.path.insert(0, \"backend\"); from seeds.seed_fuji_data import seed_database; seed_database()' && python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.2
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fujitrack-neon-postgres
          property: connectionString

databases:
  - name: fujitrack-neon-postgres
    region: oregon
    plan: free
